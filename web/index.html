<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>VisionShift AI</title><style>body{background:#101522;color:#eee;font:16px system-ui;margin:24px}main{display:flex;flex-wrap:wrap;gap:16px}video,canvas{width:min(100%,560px);background:#222;border-radius:12px}button,select,input{padding:10px;margin:5px}label{display:inline-block}</style><h1>VisionShift AI</h1><p>Live camera transformation studio</p><main><section>Original<br><video autoplay muted playsinline></video></section><section>Transformed<br><canvas></canvas></section></main><button id="start">Start camera</button><button id="stop">Stop</button><select id="effect"><option>Original</option><option>Cartoon</option><option>Sketch</option><option>Thermal</option><option>Night vision</option><option>Cinematic</option><option>Invert</option><option>AI style</option></select><label>Intensity <input id="strength" type="range" min="0" max="1" step=".01" value=".8"></label><input id="worker" placeholder="AI worker URL" value="http://localhost:8000"><button id="record">Record</button><button id="share">Create WebRTC offer</button><textarea id="signal" placeholder="SDP offer / remote answer"></textarea><button id="answer">Apply answer</button><p id="status" role="status"></p><script type="module" src="app.js"></script></html>
